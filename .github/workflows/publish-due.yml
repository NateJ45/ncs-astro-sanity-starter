name: Publish scheduled drafts

# Free-tier scheduled publishing. Sanity's own Scheduled Drafts needs the Growth
# plan, so instead: an editor sets "Publish automatically at" on a draft in the
# Studio, and this job publishes it once the time has passed.
# See scripts/publish-due.mjs and src/sanity/schemaTypes/_publishAt.ts.
#
# ── WHY THIS JOB DOES NOT RUN `npm ci` ───────────────────────────────────────
# At */30 this runs 48 times a day. Installing the full dependency tree each
# time would burn a few minutes of Actions time per run in order to make three
# HTTP calls. publish-due.mjs is therefore dependency-free: it uses global fetch
# against Sanity's HTTP API, so the job is checkout + setup-node + node, a few
# seconds. Do NOT add an install step here; if the script ever needs a package,
# that is the signal that the design broke, not that the job needs npm.
#
# ── THIS REPO IS A TEMPLATE ──────────────────────────────────────────────────
# ncs-astro-sanity-starter ships no Sanity project of its own, so there are no
# drafts to publish and the schedule is COMMENTED OUT (same stance as
# sanity-backup.yml elsewhere in the family). It is committed anyway so a FORK
# inherits working scheduled publishing on day one.
#
# To enable in a fork, per site:
#   1. Set the SANITY_API_WRITE_TOKEN repo secret: a Sanity token with the
#      Editor role. Not SANITY_AUTH_TOKEN, which the backup workflow uses and
#      which is usually a READ token (it cannot publish). Card 111.
#   2. Set the SANITY_PROJECT_ID repo variable to that site's Sanity project id.
#      Not a secret (it ships in the client bundle), a variable because this
#      file is a template and every fork has a different one.
#   3. Uncomment the `schedule:` block below.
#
# The two-job gate below is the load-bearing part and is intact: with the secret
# or the variable missing, the workflow logs a warning and skips rather than
# failing. That is what makes it safe to commit before either exists.
# workflow_dispatch stays on, so a manual run always works.
#
# AFTER A PUBLISH IT REBUILDS THE SITE (card 111). The site is statically built,
# so a scheduled publish nobody deploys is invisible. When a run published
# anything it starts deploy.yml itself (workflow_dispatch with the job's own
# GITHUB_TOKEN, which GitHub allows). With the Sanity publish webhook set up as
# well, deploy.yml's concurrency group queues the second build.
#
# ── HONEST TIMING ────────────────────────────────────────────────────────────
# */30 means "within about half an hour of the time the editor picked", and the
# field description in the Studio says exactly that. GitHub's scheduler is also
# best-effort and can be delayed under load, so treat this as a soft promise.
on:
  # schedule:
  #   - cron: '*/30 * * * *' # every half hour
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SANITY_API_WRITE_TOKEN secret and/or SANITY_PROJECT_ID variable not set; skipping scheduled publishing. Expected in the unforked template."
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to start deploy.yml after a publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No install step on purpose. See the header.
      - name: Publish anything whose time has come
        id: publish
        shell: bash
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
        # --apply is what turns the script from a dry run into a publish. The
        # script defaults to dry-run precisely so that a human running it by
        # hand cannot publish by accident. The log is kept so the next step
        # knows whether anything went out; the script's own exit code is kept
        # too, so a failed publish still turns the run red.
        run: |
          set +e
          node scripts/publish-due.mjs --apply | tee publish.log
          code=${PIPESTATUS[0]}
          if grep -qE '^publish-due: published [1-9]' publish.log; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          exit $code

      # Something went out, so build the website (card 111). always() so a run
      # where one document failed still deploys the ones that succeeded.
      - name: Rebuild the website
        if: always() && steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
