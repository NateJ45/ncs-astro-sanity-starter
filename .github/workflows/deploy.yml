name: Deploy

# Deploys the production Worker. The Worker NAME is not written here: it comes
# from wrangler.jsonc by way of the adapter's generated config, which is what
# `npm run apply-brand` already rewrites for a fork.
#
# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────
# Until 2026-09-18 this starter shipped no production deploy at all. There was
# a staging-branch deploy (since removed, 2026-10-03) and nothing for `main`, so every
# project forked from here wrote this same workflow on day one: stonesteps-50k
# forked at 13:59 on 2026-09-07 and was authoring its own deploy workflow by
# 20:30 the same evening. Until a fork did that, a merged code change was live
# only if somebody remembered, and a Sanity publish was live only if somebody
# remembered twice.
#
# ── THE THREE WAYS IT FIRES ─────────────────────────────────────────────────
# push to main          a code change. Docs-only paths are ignored, see below.
# repository_dispatch   an editor published in the Studio. A Sanity webhook
#   (sanity-publish)    POSTs to GitHub's dispatches endpoint. This is the piece
#                       that makes content edits reach the live site on their
#                       own, because the site is STATICALLY BUILT: publishing in
#                       Sanity changes the dataset and nothing else. Wiring the
#                       webhook is a per-project setup step; see
#                       docs/agent/deployment.md.
# workflow_dispatch     a human, for when something needs pushing out now.
#
# ── WHAT IT WILL NOT DO ─────────────────────────────────────────────────────
# It will not deploy a build whose unit tests fail. They run in well under a
# second and three of them are gates rather than ordinary suites: colour
# contrast over the theme palette, the layout-variant column derivation, and
# the section-field drift check. `astro build` does NOT type-check, so without
# this step a red repo could still ship.
#
# Playwright is deliberately NOT run here. ci.yml runs it on the same push, in
# parallel, and duplicating a browser matrix in the deploy path buys nothing:
# if it fails, the fix is another commit either way.

on:
  push:
    branches: [main]
    paths-ignore:
      # Prose that cannot reach the built site. Everything else deploys,
      # because a missed deploy is a worse failure than a spare one.
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'OPERATIONS.md'
      - 'PORTS.md'
      - '.github/**/*.md'
      - '.claude/**/*.md'
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

# Deploys queue rather than cancelling each other. cancel-in-progress would
# abort a run mid `wrangler deploy`, and three spare minutes is a much better
# outcome than an interrupted upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        # A secret cannot be read in an `if:` expression, so the check happens
        # in a step. Missing credentials warn and skip rather than failing, so
        # a fresh fork of this starter is never red for a reason it cannot yet
        # fix. Same pattern as uptime.yml and sanity-backup.yml.
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials not set; skipping the production deploy."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the two "tell someone" steps at the end
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Text read out of uploaded files for site search, kept between runs so each
      # file is fetched and read once (PORTS.md card 154). After npm ci, which
      # empties node_modules. Sanity file URLs are content hashes, so it never goes stale.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/search-files
          key: search-files-${{ github.run_id }}
          restore-keys: search-files-

      # The share cards (scripts/build-og-cards.mjs, PORTS.md card 169), cached by a hash of each
      # card, and the Studio icon's download (scripts/build-brand-icons.mjs, card 168), kept between
      # runs so a build only draws a card whose words or design changed. A miss draws the card with
      # the runner's Chrome; with no browser the page shares og-default.png and the build still passes.
      - uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/og-cards
            node_modules/.cache/brand-icon
          key: og-cards-${{ github.run_id }}
          restore-keys: og-cards-

      - name: Generate Sanity types
        run: npm run typegen

      - name: Unit tests
        run: npm run test:unit

      # NO SHARE-CARD FRESHNESS CHECK NEEDED (PORTS.md card 169): `npm run build` draws
      # every page's card itself (scripts/build-og-cards.mjs), so a card cannot go stale.
      # It never fails the build either: with no browser it falls back to
      # og-default.png with a warning, so a content change always goes live.

      - name: Build
        env:
          # Without these the build succeeds and ships EMPTY pages, because
          # sanityFetch falls back silently when the project id is absent. That
          # is the right behaviour for a fresh clone and the wrong thing to
          # deploy over a live site, so treat a missing variable here as a real
          # problem.
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
          # Analytics, and ONLY on this workflow. Do not "fix" the omission by
          # copying these into ci.yml or lighthouse.yml.
          # Lighthouse alone would file about eighteen localhost page views into
          # the live property on every run, and that data is indistinguishable
          # from real traffic once it lands. The GA4 tag loads after the load
          # event, so it sits outside LCP by construction and the performance
          # gate measures exactly the same thing without it. Unset is a silent
          # no-op everywhere, so those builds simply ship no tag.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$PUBLIC_SANITY_PROJECT_ID" ]; then
            echo "::error::PUBLIC_SANITY_PROJECT_ID is not set. The build would ship empty pages over the live site."
            exit 1
          fi
          npm run build

      # THE CONFIG FLAG IS LOAD-BEARING. This is a hybrid static+SSR build, and
      # a plain `wrangler deploy` reads the SOURCE wrangler.jsonc, which knows
      # nothing about the adapter's generated asset manifest: every sub-route
      # 404s. Deploy the adapter's own config, exactly as `npm run deploy` does.
      # No `--name` here: production IS the name in
      # wrangler.jsonc.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c dist/server/wrangler.json

      # A deploy that 200s on the home page and empties every sub-route is a
      # failure this family has already had once, via assets.not_found_handling.
      # Prove the routes rather than trusting the upload.
      #
      # The base URL is DERIVED, never hardcoded: repo variable PRODUCTION_URL
      # if the project set one (a custom domain, or the workers.dev host), else
      # the domain in src/data/site.ts, which apply-brand writes. A fork that
      # has changed neither still has the placeholder domain, and smoking
      # example.com would be a test of somebody else's server, so the step says
      # so and skips.
      #
      # ROUTES is built a line at a time so `npm run scaffold -- --remove` can
      # take a removed page out of it (PORTS.md card 100); a smoke that 404s on
      # a page the fork deleted on purpose fails the first deploy.
      - name: Smoke the deployed site
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          BASE="$PRODUCTION_URL"
          if [ -z "$BASE" ]; then
            DOMAIN=$(sed -n "s/^const _domain = '\(.*\)';.*/\1/p" src/data/site.ts)
            BASE="https://$DOMAIN"
          fi
          case "$BASE" in
            *example.com*|https://)
              echo "::warning::No production URL configured (src/data/site.ts still has the placeholder domain, and vars.PRODUCTION_URL is unset). Skipping the smoke."
              exit 0
              ;;
          esac
          echo "Smoking $BASE"
          FAIL=0
          ROUTES="/ /contact/ /privacy/"
          ROUTES="$ROUTES /about/" # scaffold: about
          ROUTES="$ROUTES /services/" # scaffold: services
          ROUTES="$ROUTES /process/" # scaffold: process
          ROUTES="$ROUTES /faq/" # scaffold: faq
          ROUTES="$ROUTES /journal/" # scaffold: journal
          for path in $ROUTES; do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' "$BASE$path")
            echo "$CODE $path"
            [ "$CODE" = "200" ] || FAIL=1
          done
          # One content assertion, so an empty-but-200 deploy cannot pass. The
          # site name is in every page's <title>, and it is the first thing a
          # fallback-content build would still get right, so check for it on a
          # page whose body comes from Sanity rather than on the shell alone.
          NAME=$(sed -n "s/^const _name = '\(.*\)';.*/\1/p" src/data/site.ts)
          curl -sL "$BASE/" | grep -qF "$NAME" || {
            echo "::error::The home page rendered without the site name in it."
            FAIL=1
          }
          exit $FAIL

      # ── TELL SOMEONE (PORTS.md card 111) ──────────────────────────────────
      # The Studio's status line reads this workflow's latest run through the
      # Worker route /api/studio/deploy-status/ and, on a failure, tells the
      # editor "The last update didn't go through. <helper> has been told."
      # This is the telling: ONE open issue labelled deploy-failed (a comment
      # on it for each further failure, never a pile of issues), which GitHub
      # emails to whoever watches the repo, the owner by default. The next green
      # deploy closes it. The words are public on a public repo, so they carry
      # the event name and the run link and nothing else.
      - name: Tell someone the deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create deploy-failed --color B60205 --description "The production deploy failed" 2>/dev/null || true
          OPEN=$(gh issue list --label deploy-failed --state open --json number --jq '.[0].number')
          BODY="The production deploy failed (event: $GITHUB_EVENT_NAME). Run: $RUN_URL. The next green deploy closes this issue."
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "The website did not update" --label deploy-failed --body "$BODY"
          fi

      - name: Close the failure issue once it is green again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label deploy-failed --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Deployed fine again: $RUN_URL"
          done
