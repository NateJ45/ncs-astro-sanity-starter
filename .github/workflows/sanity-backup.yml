name: Sanity dataset backup

# Nightly export of the production Sanity dataset (documents + assets) so a bad
# mutation, a bad seed script, or an accidental "Remove field" in Studio is
# always recoverable. CLAUDE.md's first hard rule warns that "Remove field"
# deletes that field's data across every document and cannot be undone without
# a dataset restore; this workflow is what makes that restore possible.
#
# PORTS.md card 6. Harvested into the starter on 2026-09-06 from
# ncs-church-starter, which is being retired, with the two fixes the client
# repos had already earned: the encrypt-before-upload step (wcp-website 73cfe3c
# / presacademy) and the `--project-id` flag on the export (reid-design-site,
# 2026-09-05).
#
# ── THIS REPO IS A TEMPLATE ──────────────────────────────────────────────────
# ncs-astro-sanity-starter ships no Sanity project of its own, so there is
# nothing here worth backing up and the schedule is COMMENTED OUT (same stance
# as publish-due.yml). It is committed anyway so a FORK inherits a working
# backup on day one.
#
# To enable in a fork, per site:
#   1. Set the SANITY_AUTH_TOKEN repo secret (a READ token is enough).
#   2. Set the BACKUP_PASSPHRASE repo secret (a long random passphrase, e.g.
#      `openssl rand -base64 32`). It encrypts the artifact, see the warning
#      below. Store a copy OUTSIDE GitHub, somewhere the client can find it:
#      GitHub never shows a secret again, and a backup nobody can decrypt is no
#      backup.
#   3. Set the SANITY_PROJECT_ID repo variable to that site's Sanity project id.
#      It is NOT a secret (it ships in the client bundle and appears in every
#      GROQ request URL) but it is a repo variable rather than a hardcoded
#      literal precisely because this file is a template.
#   4. Uncomment the `schedule:` block below.
# GitHub Actions minutes are free on public repositories, so a public fork can
# leave the schedule on permanently. On a private fork, weigh the daily minute.
#
# WARNING: the export is ENCRYPTED before upload, and that is load-bearing.
# On a PUBLIC repo any logged-in GitHub user can download workflow artifacts,
# and a dataset can hold contact submissions or member content that must not be
# public. A plaintext artifact publishes all of it. That is why the gate
# refuses to export when BACKUP_PASSPHRASE is missing: skipping a backup is
# recoverable, publishing the dataset is not. Never upload the tarball without
# the openssl step.
#
# RESTORE: `scripts/restore-dataset.mjs` does the decrypt, the import and the
# document count in one command, and refuses to target production without a
# deliberately awkward flag:
#   BACKUP_PASSPHRASE=*** SANITY_AUTH_TOKEN=*** node scripts/restore-dataset.mjs \
#     --file sanity-backup-<date>.tar.gz.enc --project <id> --dataset restore-drill --create
#
# DRILL IT, do not assume it. This workflow was green on every site for months
# before anyone checked that the tarballs restore; a green export proves the
# export works and nothing about recovery. docs/RESTORE-DRILL.md is the ten
# minute exercise, and it belongs in every site's launch checklist.
#
# The two-job gate below is the load-bearing part: with a secret or the
# variable missing, the workflow logs a warning and skips rather than failing.
# That is what makes it safe to commit before any of them exist.
# workflow_dispatch stays on, so a manual run always works.

on:
  # schedule:
  #   - cron: '0 7 * * *' # daily 07:00 UTC
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        # A secret cannot be read in an `if:` expression, so the check has to
        # happen in a step. This job deliberately does not check out the repo:
        # it needs nothing but the secrets' presence.
        env:
          TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SANITY_AUTH_TOKEN secret and/or SANITY_PROJECT_ID variable not set; skipping backup. Expected in the unforked template."
          elif [ -z "$PASSPHRASE" ]; then
            # No passphrase means the artifact would upload as PLAINTEXT on a
            # public repo. Refuse to export at all rather than publish the
            # dataset. See the header warning.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BACKUP_PASSPHRASE not set; skipping backup so the dataset never uploads unencrypted. See the header of sanity-backup.yml."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The sanity CLI comes from the ROOT install: the Studio folded into the
      # root package on 2026-08-28 (PORTS.md card 10), so there is no
      # `npm ci --prefix studio` step any more.
      - name: Install dependencies
        run: npm ci

      - name: Export production dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          # This site's PUBLIC Sanity id (not a secret; it ships in the client
          # bundle). A repo variable, not a literal, because this file is a
          # template. See the header.
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: production
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          # --project-id is required. The sanity CLI walks cwd upward looking
          # for sanity.cli.ts to infer the project, and on a repo that still
          # nests the CLI under studio/ that discovery fails from the repo root
          # (reid-design-site, 2026-09-05: the first real run after
          # SANITY_AUTH_TOKEN was set died with ProjectRootNotFoundError until
          # the flag was added). Harmless here too, where the CLI already lives
          # at the root. Called by path rather than through npx so the export
          # runs from the repo root and writes the tarball there.
          ./node_modules/.bin/sanity dataset export production "sanity-backup-$STAMP.tar.gz" \
            --project-id "$SANITY_STUDIO_PROJECT_ID"

      # Encrypt BEFORE upload, see the header warning. AES-256-CBC with a
      # PBKDF2-stretched passphrase; openssl ships on every runner and every
      # laptop a restore would happen on.
      - name: Encrypt the export
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for f in sanity-backup-*.tar.gz; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in "$f" -out "$f.enc" -pass env:BACKUP_PASSPHRASE
            rm "$f"
          done
          ls -lh sanity-backup-*.tar.gz.enc

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanity-backup
          path: sanity-backup-*.tar.gz.enc
          # 90 days is the ceiling GitHub allows, and it is not the durable
          # copy: see the R2 step below.
          retention-days: 90

      # OFF-SITE COPY. The artifact above expires after 90 days and lives in the
      # same GitHub account as the repo it protects, so a lost account loses the
      # site AND its backups together. R2 is a different provider and a
      # different blast radius.
      #
      # No new credentials: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are
      # already set in every site repo for the deploy. The token does need R2
      # write permission added to it - a deploy-only token will 403 here.
      #
      # To enable, per site:
      #   1. Create the bucket:  npx wrangler r2 bucket create <name>
      #   2. Add "Workers R2 Storage: Edit" to CLOUDFLARE_API_TOKEN
      #   3. Set the BACKUP_R2_BUCKET repo variable to <name>
      # Unset, this step skips with a warning and the artifact still uploads,
      # matching the stance of the gate job: a missing off-site copy must never
      # fail the backup that is otherwise working.
      #
      # The tarball is ALREADY encrypted at this point. Do not move this step
      # above the encrypt step.
      - name: Copy the backup off-site to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::BACKUP_R2_BUCKET variable and/or Cloudflare credentials not set; the backup exists only as a 90-day GitHub artifact. See the header of sanity-backup.yml."
            exit 0
          fi
          for f in sanity-backup-*.tar.gz.enc; do
            # Keyed by repo so one bucket can hold the whole family, and by date
            # so a bad dataset restored last week has not overwritten the good
            # copy from the week before.
            KEY="sanity/${GITHUB_REPOSITORY##*/}/$f"
            echo "uploading $f -> $BUCKET/$KEY"
            npx wrangler r2 object put "$BUCKET/$KEY" --file "$f" --remote
          done
